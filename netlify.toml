[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Playwright is a dev-only tool here (the smoke test and the OG image render).
  # Netlify installs devDependencies, so stop its postinstall pulling ~150MB of
  # browsers into a build that never opens one.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # PRE-LAUNCH: the site carries a real person's name and number before
    # she has agreed to it. Remove this line the day she signs.
    X-Robots-Tag = "noindex, nofollow"
